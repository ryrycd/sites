<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dave&#39;s Fresh Pasta · now and new</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0e;--panel:#18181a;--ink:#f3f2ef;--mute:#9b9a96;--line:rgba(255,255,255,.1);--acc:#be4747;--bad:#ff6b5b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Geist",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
header b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header span{font-size:12.5px;color:var(--mute);white-space:nowrap}
.stage{position:relative;flex:1;min-height:0}
.pane{position:absolute;inset:0;transition:opacity .35s ease, transform .45s cubic-bezier(.2,.7,.1,1)}
.pane.off{opacity:0;pointer-events:none;transform:scale(.985)}
.now{overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff}
.now img{width:100%;display:block}
.now .flags{position:sticky;top:0;z-index:2;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:rgba(13,13,14,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);scrollbar-width:none}
.now .flags::-webkit-scrollbar{display:none}
.flag{flex:none;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:#fff;padding:6px 11px;border-radius:999px;background:rgba(255,107,91,.16);border:1px solid rgba(255,107,91,.45)}
.flag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bad)}
.new iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.dock{padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center}
.seg{flex:1;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;position:relative}
.seg button{position:relative;z-index:1;height:46px;border:0;background:none;color:var(--mute);font:600 15px/1 inherit;border-radius:999px;cursor:pointer;transition:color .25s}
.seg button.on{color:#111}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:#fff;transition:transform .35s cubic-bezier(.2,.7,.1,1)}
.seg.right i{transform:translateX(100%)}
.open{flex:none;height:54px;padding:0 16px;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
/* desktop: side by side phones */
@media (min-width:980px){
  body{overflow:auto}
  .app{position:static;min-height:100%}
  .stage{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:10px 48px 40px;max-width:1100px;margin:0 auto;width:100%}
  .pane{position:relative;inset:auto;opacity:1!important;pointer-events:auto!important;transform:none!important;height:min(82vh,860px);border-radius:34px;overflow:hidden;border:10px solid #222;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
  .now{overflow-y:auto}
  .pane::before{content:attr(data-label);position:absolute;top:-34px;left:4px;font-weight:600}
  .dock{display:none}
  .lab{display:block}
}
.lab{display:none}
</style>
</head>
<body>
<div class="app">
  <header><b>Dave&#39;s Fresh Pasta</b><span>Your site now · the new one</span></header>
  <div class="stage">
    <section class="pane now" id="now" data-label="Your site now">
      <div class="flags"><span class="flag">Very long page on phones</span><span class="flag">Slow to load on phones</span><span class="flag">White text hard to read</span></div>
      <img src="before.jpg" alt="Dave&#39;s Fresh Pasta's current website on a phone">
    </section>
    <section class="pane new off" id="new" data-label="The new site">
      <iframe src="../" title="New website for Dave&#39;s Fresh Pasta" loading="eager"></iframe>
    </section>
  </div>
  <div class="dock">
    <div class="seg" id="seg"><i></i><button class="on" data-v="now">Now</button><button data-v="new">New</button></div>
    <a class="open" href="../" target="_blank" rel="noopener">Open ↗</a>
  </div>
</div>
<script>
(function(){
  var seg=document.getElementById('seg'), now=document.getElementById('now'), nw=document.getElementById('new');
  function show(v){
    seg.classList.toggle('right', v==='new');
    [].forEach.call(seg.querySelectorAll('button'), function(b){ b.classList.toggle('on', b.dataset.v===v); });
    now.classList.toggle('off', v!=='now'); nw.classList.toggle('off', v!=='new');
    try{ history.replaceState(null,'', v==='new' ? '#new' : '#now'); }catch(e){}
  }
  seg.addEventListener('click', function(e){ var b=e.target.closest('button'); if(b) show(b.dataset.v); });
  var sx=null; document.querySelector('.stage').addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; }, {passive:true});
  document.querySelector('.stage').addEventListener('touchend', function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>80) show(dx<0?'new':'now'); sx=null; }, {passive:true});
  show(location.hash==='#new' ? 'new' : 'now');
})();
</script>
</body>
</html>
